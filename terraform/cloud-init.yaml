#cloud-config

# Boot configuration for ParkFlow + MilHub Shared VM (Container-Optimized OS)
# Runs infrastructure containers: Redis, RabbitMQ (ParkFlow), Kafka KRaft (MilHub)

runcmd:
  # 1. Redis container (Shared / ParkFlow + MilHub)
  - docker run -d --name redis --restart=always -p 6379:6379 redis:alpine
  
  # 2. RabbitMQ container (ParkFlow only)
  - docker run -d --name rabbitmq --restart=always -p 5672:5672 -p 15672:15672 -e RABBITMQ_DEFAULT_USER=parkflow -e RABBITMQ_DEFAULT_PASS=parkflow rabbitmq:3-management-alpine

  # 3. Kafka KRaft container (MilHub only - limit heap to 512MB)
  - docker run -d --name kafka --restart=always -p 9092:9092 \
      -e KAFKA_NODE_ID=1 \
      -e KAFKA_PROCESS_ROLES=broker,controller \
      -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
      -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://10.0.0.3:9092 \
      -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
      -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
      -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
      -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
      -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
      -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
      -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
      -e KAFKA_NUM_PARTITIONS=1 \
      -e KAFKA_HEAP_OPTS="-Xmx512m -Xms512m" \
      apache/kafka:3.7.0
