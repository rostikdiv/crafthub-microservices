# ======================================================
# === ЗАГАЛЬНІ НАЛАШТУВАННЯ ===
# ======================================================
server:
  port: 8080 # (Я залишив 8080, як у твоєму файлі)

spring:
  application:
    name: api-gateway
  profiles:
    active: local # ❗️ Профіль за замовчуванням

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user_service_route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
        - id: product_service_route
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
            - Path=/api/v1/categories/**
        - id: order_service_route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: cart_service_route
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
        - id: payment_service_route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: delivery_service_route
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/delivery/**


management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    com.crafthub.api_gateway: DEBUG

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItY3JhZnRodWItbWljcm9zZXJ2aWNlcy1hbmQtZm9yLWp3dC1zaWduYXR1cmUtZ2VuZXJhdGlvbg==}
      expiration: ${JWT_EXPIRATION:86400000}

---
# ======================================================
# === ПРОФІЛЬ "local" (Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

aws:
  xray:
    enabled: false

---
# ======================================================
# === ПРОФІЛЬ "aws" (X-Ray) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
  cloud:
    discovery:
      enabled: false # Вимикаємо будь-яке discovery
    gateway:
      discovery:
        locator:
          enabled: false # ❗️ НЕ шукати сервіси в Eureka
      routes:
        # ❗️ ПЕРЕВИЗНАЧАЄМО МАРШРУТИ ДЛЯ AWS
        - id: user_service_route
          # ❗️ Вказуємо DNS-ім'я з Cloud Map (заміни 'crafthub.internal' на свій namespace)
          uri: http://user-service.crafthub.internal:8081
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
        - id: product_service_route
          uri: http://product-service.crafthub.internal:8082
          predicates:
            - Path=/api/v1/products/**
        - id: order_service_route
          uri: http://order-service.crafthub.internal:8083
          predicates:
            - Path=/api/v1/orders/**
        - id: cart_service_route
          uri: http://cart-service.crafthub.internal:8085
          predicates:
            - Path=/api/v1/cart/**
aws:
  xray:
    enabled: true

management:
  tracing:
    enabled: false