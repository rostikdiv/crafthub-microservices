# ======================================================
# === GENERAL CONFIGURATION ===
# ======================================================
server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: local

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # Route for User Service (Auth, Profile, Admin)
            - id: user_service_route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/admin/**, /api/v1/auth/**, /api/v1/sellers/**, /api/v1/seller-reviews/**, /api/v1/documents/**, /api/v1/military/**
              filters:
                - AuthenticationFilter

            # Route for Product Service (Catalog, Reviews)
            - id: product_service_route
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/reviews/**
              filters:
                - AuthenticationFilter

            # Route for Order Service
            - id: order_service_route
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - AuthenticationFilter

            # Route for Cart Service
            - id: cart_service_route
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - AuthenticationFilter

            # Route for Payment Service
            - id: payment_service_route
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - AuthenticationFilter

            # Route for Delivery Service
            - id: delivery_service_route
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/delivery/**
              filters:
                - AuthenticationFilter

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    com.crafthub.api_gateway: DEBUG

application:
  security:
    jwt:
      # JWT signature key and expiration (standardized across services)
      secret-key: ${JWT_SECRET_KEY:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItY3JhZnRodWItbWljcm9zZXJ2aWNlcy1hbmQtZm9yLWp3dC1zaWduYXR1cmUtZ2VuZXJhdGlvbg==}
      expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: api-gateway
        url: /v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: product-service
        url: /product-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
      - name: cart-service
        url: /cart-service/v3/api-docs
      - name: payment-service
        url: /payment-service/v3/api-docs
      - name: delivery-service
        url: /delivery-service/v3/api-docs

---
# ======================================================
# === PROFILE: "local" (Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  # Disable AWS components locally
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

aws:
  xray:
    enabled: false

---
# ======================================================
# === PROFILE: "aws" (X-Ray) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
  cloud:
    discovery:
      enabled: false # Using native AWS service discovery
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user_service_route
              uri: http://user-service.crafthub.internal:8081
              predicates:
                - Path=/api/v1/users/**, /api/v1/admin/**, /api/v1/auth/**, /api/v1/sellers/**, /api/v1/seller-reviews/**, /api/v1/documents/**, /api/v1/military/**
              filters:
                - AuthenticationFilter

            - id: product_service_route
              uri: http://product-service.crafthub.internal:8082
              predicates:
                - Path=/api/v1/products/**
              filters:
                - AuthenticationFilter

            - id: order_service_route
              uri: http://order-service.crafthub.internal:8083
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - AuthenticationFilter

            - id: cart_service_route
              uri: http://cart-service.crafthub.internal:8085
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - AuthenticationFilter
aws:
  xray:
    enabled: true

management:
    enabled: false
