# GitHub Actions Workflow: Automated Deployment of MilHub Microservices to GCP Cloud Run
# Triggers on push to the 'main' branch or manual workflow execution via 'workflow_dispatch'.

name: Deploy MilHub Microservices to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for OIDC authentication via Workload Identity Federation
permissions:
  contents: read
  id-token: write

# Global environment variables used across deployment steps
env:
  GCP_REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev
  GAR_REPOSITORY: milhub-repo
  VPC_NETWORK: parkflow-vpc
  VPC_SUBNET: parkflow-subnet
  KAFKA_BOOTSTRAP: 10.0.0.3:9092
  DB_HOST: 10.140.95.3

jobs:
  # Job 1: Detect which microservices have code changes to optimize build and deployment time
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      user-service: ${{ steps.filter.outputs.user-service }}
      product-service: ${{ steps.filter.outputs.product-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      cart-service: ${{ steps.filter.outputs.cart-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      delivery-service: ${{ steps.filter.outputs.delivery-service }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Paths filter to detect modifications in specific microservice directories
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
              - '.github/workflows/deploy.yml'
            user-service:
              - 'user-service/**'
              - '.github/workflows/deploy.yml'
            product-service:
              - 'product-service/**'
              - '.github/workflows/deploy.yml'
            order-service:
              - 'order-service/**'
              - '.github/workflows/deploy.yml'
            cart-service:
              - 'cart-service/**'
              - '.github/workflows/deploy.yml'
            notification-service:
              - 'notification-service/**'
              - '.github/workflows/deploy.yml'
            payment-service:
              - 'payment-service/**'
              - '.github/workflows/deploy.yml'
            delivery-service:
              - 'delivery-service/**'
              - '.github/workflows/deploy.yml'

  # Job 2: Build JAR packages, containerize with Docker, push to Artifact Registry, and deploy to Cloud Run
  deploy-services:
    needs: detect-changes
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Authenticate securely to Google Cloud using Workload Identity Federation (keyless auth)
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Authenticate Docker CLI to GCP Artifact Registry
      - name: Configure Docker authentication for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      # Run full test suite across the Maven reactor before building deployable artifacts.
      # Uses 'verify' (not just 'test') so the build fails on the same lifecycle phase as pr-check.yml.
      - name: Run Tests
        run: mvn clean verify

      # Package all Spring Boot microservices into JAR files (tests already passed above)
      - name: Build All Microservices JARs
        run: mvn package -DskipTests

      # -----------------------------------------------------------------------
      # 1. API Gateway Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy API Gateway
        if: ${{ needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/api-gateway:${{ github.sha }}"
          docker build -t $IMAGE -f ./api-gateway/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-api-gateway \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }}" \
            --set-secrets "JWT_SECRET=milhub-jwt-secret:latest"

      # -----------------------------------------------------------------------
      # 2. User Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy User Service
        if: ${{ needs.detect-changes.outputs.user-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/user-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./user-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-user-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }},DB_URL=jdbc:postgresql://${{ env.DB_HOST }}:5432/user_service_db" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=milhub-db-password:latest,JWT_SECRET=milhub-jwt-secret:latest,GCS_HMAC_ACCESS_KEY=gcs-hmac-access-key:latest,GCS_HMAC_SECRET_KEY=gcs-hmac-secret-key:latest"

      # -----------------------------------------------------------------------
      # 3. Product Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy Product Service
        if: ${{ needs.detect-changes.outputs.product-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/product-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./product-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-product-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }},DB_URL=jdbc:postgresql://${{ env.DB_HOST }}:5432/product_service_db" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=milhub-db-password:latest,JWT_SECRET=milhub-jwt-secret:latest,GCS_HMAC_ACCESS_KEY=gcs-hmac-access-key:latest,GCS_HMAC_SECRET_KEY=gcs-hmac-secret-key:latest"

      # -----------------------------------------------------------------------
      # 4. Order Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy Order Service
        if: ${{ needs.detect-changes.outputs.order-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/order-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./order-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-order-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }},DB_URL=jdbc:postgresql://${{ env.DB_HOST }}:5432/order_service_db" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=milhub-db-password:latest,JWT_SECRET=milhub-jwt-secret:latest"

      # -----------------------------------------------------------------------
      # 5. Cart Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy Cart Service
        if: ${{ needs.detect-changes.outputs.cart-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/cart-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./cart-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-cart-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }}" \
            --set-secrets "JWT_SECRET=milhub-jwt-secret:latest,SPRING_DATA_MONGODB_URI=milhub-mongo-uri:latest"

      # -----------------------------------------------------------------------
      # 6. Notification Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy Notification Service
        if: ${{ needs.detect-changes.outputs.notification-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/notification-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./notification-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-notification-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }},SPRING_MAIL_USERNAME=${{ secrets.MAILTRAP_USER }},SPRING_MAIL_PASSWORD=${{ secrets.MAILTRAP_PASS }},SPRING_MAIL_PORT=587" \
            --set-secrets "JWT_SECRET=milhub-jwt-secret:latest"

      # -----------------------------------------------------------------------
      # 7. Payment Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy Payment Service
        if: ${{ needs.detect-changes.outputs.payment-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/payment-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./payment-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-payment-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }},DB_URL=jdbc:postgresql://${{ env.DB_HOST }}:5432/payment_service_db" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=milhub-db-password:latest,JWT_SECRET=milhub-jwt-secret:latest"

      # -----------------------------------------------------------------------
      # 8. Delivery Service Deployment
      # -----------------------------------------------------------------------
      - name: Build & Deploy Delivery Service
        if: ${{ needs.detect-changes.outputs.delivery-service == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/delivery-service:${{ github.sha }}"
          docker build -t $IMAGE -f ./delivery-service/Dockerfile .
          docker push $IMAGE
          gcloud run deploy milhub-delivery-service \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --memory 1Gi \
            --platform managed \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --network=${{ env.VPC_NETWORK }} \
            --subnet=${{ env.VPC_SUBNET }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars "SPRING_PROFILES_ACTIVE=cloud,KAFKA_BOOTSTRAP_SERVERS=${{ env.KAFKA_BOOTSTRAP }},DB_URL=jdbc:postgresql://${{ env.DB_HOST }}:5432/delivery_service_db" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=milhub-db-password:latest,JWT_SECRET=milhub-jwt-secret:latest"