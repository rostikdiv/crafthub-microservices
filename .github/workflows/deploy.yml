name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 437387546814.dkr.ecr.eu-north-1.amazonaws.com
  ECS_CLUSTER: crafthub-cluster

jobs:
  # ==========================================
  # 1. ORDER SERVICE
  # ==========================================
  deploy-order-service:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'order-service/') || contains(github.event.head_commit.added, 'order-service/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build JAR
        run: mvn clean package -pl order-service -am -DskipTests

      - name: Build & Push Docker Image
        run: |
          docker build -t $ECR_REGISTRY/crafthub/order-service:latest -f ./order-service/Dockerfile .
          docker push $ECR_REGISTRY/crafthub/order-service:latest

      - name: Update ECS Service
        run: aws ecs update-service --cluster $ECS_CLUSTER --service order-service --force-new-deployment

  # ==========================================
  # 2. CART SERVICE
  # ==========================================
  deploy-cart-service:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'cart-service/') || contains(github.event.head_commit.added, 'cart-service/')
