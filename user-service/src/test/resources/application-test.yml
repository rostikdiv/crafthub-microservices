spring:
  datasource:
    url: jdbc:h2:mem:user_db_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  kafka:
    admin:
      auto-create: false

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  external-url: http://localhost:9000

eureka:
  client:
    enabled: false
