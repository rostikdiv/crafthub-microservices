# ======================================================
# === GENERAL CONFIGURATION ===
# ======================================================
server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: local # Default active profile

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5431/user_service_db}
    username: ${DB_USER:crafthub}
    password: ${DB_PASS:password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # Serialization for key (String) and value (JSON)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Disable type headers to avoid package mismatches between microservices
        spring.json.add.type.headers: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}


management:
  tracing:
    sampling:
      probability: 1.0

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItY3JhZnRodWItbWljcm9zZXJ2aWNlcy1hbmQtZm9yLWp3dC1zaWduYXR1cmUtZ2VuZXJhdGlvbg==}
      expiration: ${JWT_EXPIRATION:86400000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10          # Number of requests to analyze
        minimumNumberOfCalls: 5        # Start counting statistics after 5 requests
        permittedNumberOfCallsInHalfOpenState: 3 # Probing requests allowed in half-open state
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s    # Block duration before retry
        failureRateThreshold: 50       # Open if 50% of requests fail
        eventConsumerBufferSize: 10
        ignoreExceptions:              # Exceptions not counted as service failures
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest
          - com.crafthub.user_service.exception.ResourceNotFoundException
          - com.crafthub.user_service.exception.BusinessException
    instances:
      orderService:
        baseConfig: default

---
# ======================================================
# === PROFILE: "local" (Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

aws:
  xray:
    enabled: false # X-Ray disabled for local profiling

---
# ======================================================
# === PROFILE: "aws" (X-Ray) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

  cloud:
    discovery:
      enabled: false
aws:
  xray:
    enabled: true # Enable X-Ray for AWS deployment

management:
  tracing:
    enabled: false # Disable Micrometer/Zipkin to prevent conflict with X-Ray