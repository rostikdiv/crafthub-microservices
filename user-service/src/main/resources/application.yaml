# ======================================================
# === ЗАГАЛЬНІ НАЛАШТУВАННЯ ===
# ======================================================
server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: local # ❗️ Профіль за замовчуванням

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5431/user_service_db}
    username: ${DB_USER:crafthub}
    password: ${DB_PASS:password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # Серіалізація ключа (String) та значення (JSON)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Важливо: вимикаємо передачу типів класів у заголовках,
        # бо DTO в різних сервісах лежать у різних пакетах
        spring.json.add.type.headers: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin


management:
  tracing:
    sampling:
      probability: 1.0

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItY3JhZnRodWItbWljcm9zZXJ2aWNlcy1hbmQtZm9yLWp3dC1zaWduYXR1cmUtZ2VuZXJhdGlvbg==}
      expiration: ${JWT_EXPIRATION:86400000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10          # Кількість запитів для аналізу (останні 10)
        minimumNumberOfCalls: 5        # Починаємо рахувати статистику після 5 запитів
        permittedNumberOfCallsInHalfOpenState: 3 # Скільки пробних запитів пропустити, коли сервіс "оживає"
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s    # Час блокування (5 секунд), перш ніж спробувати знову
        failureRateThreshold: 50       # Якщо 50% запитів впали - відкриваємо Circuit Breaker
        eventConsumerBufferSize: 10
        ignoreExceptions:              # Помилки, які не вважаються збоєм сервісу
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest
          - com.crafthub.user_service.exception.ResourceNotFoundException
          - com.crafthub.user_service.exception.BusinessException
    instances:
      orderService:
        baseConfig: default

---
# ======================================================
# === ПРОФІЛЬ "local" (Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

aws:
  xray:
    enabled: false # ❗️ Вимикаємо X-Ray

---
# ======================================================
# === ПРОФІЛЬ "aws" (X-Ray) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

  cloud:
    discovery:
      enabled: false # ❗️ Вимикаємо
aws:
  xray:
    enabled: true # ❗️ Вмикаємо X-Ray

management:
  tracing:
    enabled: false # ❗️ Вимикаємо Micrometer/Zipkin, щоб уникнути конфлікту