# ======================================================
# === GENERAL CONFIGURATION ===
# ======================================================
server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: local # Default active profile

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5431/user_service_db}
    username: ${DB_USER:milhub}
    password: ${DB_PASS:password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # Serialization for key (String) and value (JSON)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Disable type headers to avoid package mismatches between microservices
        spring.json.add.type.headers: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}

management:
  tracing:
    sampling:
      probability: 1.0

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItY3JhZnRodWItbWljcm9zZXJ2aWNlcy1hbmQtZm9yLWp3dC1zaWduYXR1cmUtZ2VuZXJhdGlvbg==}
      expiration: ${JWT_EXPIRATION:86400000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10          # Number of requests to analyze
        minimumNumberOfCalls: 5        # Start counting statistics after 5 requests
        permittedNumberOfCallsInHalfOpenState: 3 # Probing requests allowed in half-open state
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s    # Block duration before retry
        failureRateThreshold: 50       # Open if 50% of requests fail
        eventConsumerBufferSize: 10
        ignoreExceptions:              # Exceptions not counted as service failures
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest
          - com.milhub.user_service.exception.ResourceNotFoundException
          - com.milhub.user_service.exception.BusinessException
    instances:
      orderService:
        baseConfig: default

---
# ======================================================
# === PROFILE: "local" (Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
