spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:milhub}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

feign:
  client:
    config:
      order-service:
        url: ${ORDER_SERVICE_URL}

minio:
  url: ${GCS_URL:https://storage.googleapis.com}
  access-key: ${GCS_HMAC_ACCESS_KEY}
  secret-key: ${GCS_HMAC_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    json:
      enabled: true
