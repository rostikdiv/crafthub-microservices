server:
  port: 8080

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://10.140.95.3:5432/user_service_db}
    username: ${DB_USERNAME:milhub}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.0.0.3:9092}

feign:
  client:
    config:
      order-service:
        url: ${ORDER_SERVICE_URL:https://milhub-order-service-tq7l7y43iq-uc.a.run.app}

minio:
  url: ${GCS_URL:https://storage.googleapis.com}
  access-key: ${GCS_HMAC_ACCESS_KEY}
  secret-key: ${GCS_HMAC_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    json:
      enabled: true
