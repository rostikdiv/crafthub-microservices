server:
  port: 8080

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://10.140.95.3:5432/user_service_db}
    username: ${DB_USERNAME:milhub}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.0.0.3:9092}

feign:
  client:
    config:
      order-service:
        url: ${ORDER_SERVICE_URL:https://milhub-order-service-258044247462.us-central1.run.app}

minio:
  url: ${GCS_URL:https://storage.googleapis.com}
  access-key: ${GCS_HMAC_ACCESS_KEY:}
  secret-key: ${GCS_HMAC_SECRET_KEY:}
  region: ${GCS_REGION:us-central1}
  bucket:
    avatars: ${GCS_AVATARS_BUCKET:parkflow-cloud-avatars-storage}
    documents: ${GCS_DOCUMENTS_BUCKET:parkflow-cloud-documents-protected-storage}

management:
  endpoints:
    web:
      exposure:
        include: health, liveness, readiness, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    json:
      enabled: true
