spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

feign:
  client:
    config:
      user-service:
        url: ${USER_SERVICE_URL}
      order-service:
        url: ${ORDER_SERVICE_URL}

minio:
  url: ${MINIO_URL:https://storage.googleapis.com}
