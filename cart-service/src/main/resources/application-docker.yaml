spring:
  # Якщо кошик на MongoDB:
  data:
    mongodb:
      # "mongo" - це ім'я сервісу в docker-compose
      uri: mongodb://${MONGO_USER:crafthub}:${MONGO_PASS:password}@${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DB:cart_db}?authSource=admin
  kafka:
    bootstrap-servers: kafka:9092
  zipkin:
    base-url: http://zipkin:9411
eureka:
  client:
    serviceUrl:
      defaultZone: http://service-discovery:8761/eureka/