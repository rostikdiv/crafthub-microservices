spring:
  # MongoDB configuration for Docker environment
  data:
    mongodb:
      # Uses the "mongo" service name defined in docker-compose.yml
      uri: mongodb://${MONGO_USER:milhub}:${MONGO_PASS:password}@${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DB:cart_db}?authSource=admin
  
  # Kafka bootstrap servers pointing to the "kafka" container
  kafka:
    bootstrap-servers: kafka:9092
  
  # Zipkin base URL for containerized environment
  zipkin:
    base-url: http://zipkin:9411

# Eureka Service Discovery configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://service-discovery:8761/eureka/

feign:
  client:
    config:
      product-service:
        url: ${PRODUCT_SERVICE_URL:http://product-service:8082}