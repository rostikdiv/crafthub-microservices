spring:
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

feign:
  client:
    config:
      product-service:
        url: ${PRODUCT_SERVICE_URL}

  data:
    mongodb:
      uri: ${MONGO_URI}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    json:
      enabled: true
