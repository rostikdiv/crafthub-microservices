server:
  port: 8080

spring:
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.0.0.3:9092}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGO_URI}}

feign:
  client:
    config:
      product-service:
        url: ${PRODUCT_SERVICE_URL:https://milhub-product-service-258044247462.us-central1.run.app}

management:
  endpoints:
    web:
      exposure:
        include: health, liveness, readiness, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    json:
      enabled: true
