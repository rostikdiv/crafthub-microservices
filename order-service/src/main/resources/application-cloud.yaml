server:
  port: 8080

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://10.140.95.3:5432/order_service_db}
    username: ${DB_USERNAME:milhub}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.0.0.3:9092}

feign:
  client:
    config:
      user-service:
        url: ${USER_SERVICE_URL:https://milhub-user-service-tq7l7y43iq-uc.a.run.app}
      product-service:
        url: ${PRODUCT_SERVICE_URL:https://milhub-product-service-tq7l7y43iq-uc.a.run.app}
      delivery-service:
        url: ${DELIVERY_SERVICE_URL:https://milhub-delivery-service-tq7l7y43iq-uc.a.run.app}

application:
  config:
    payment-url: ${PAYMENT_SERVICE_URL:https://milhub-payment-service-tq7l7y43iq-uc.a.run.app}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    json:
      enabled: true
