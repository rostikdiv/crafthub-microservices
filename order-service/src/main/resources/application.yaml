# ======================================================
# === ЗАГАЛЬНІ НАЛАШТУВАННЯ ===
# ======================================================
server:
  port: 8083

spring:
  application:
    name: order-service
  profiles:
    active: local # ❗️ Профіль за замовчуванням

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_service_db}
    username: ${DB_USER:crafthub}
    password: ${DB_PASS:password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    format_sql: true

management:
  tracing:
    sampling:
      probability: 1.0

---
# ======================================================
# === ПРОФІЛЬ "local" (Kafka + Zipkin + Eureka) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

  # Налаштування Kafka (тільки для local)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

feign:
  client:
    config:
      product-service:
        # Для локальної розробки (прямий доступ або через Gateway)
        url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

aws:
  xray:
    enabled: false

---
# ======================================================
# === ПРОФІЛЬ "aws" (SQS + X-Ray + Cloud Map) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # ❗️ Ми вмикаємо LoadBalancer, але не Discovery!
  # Це хитрий трюк: Feign потребує хоча б якогось механізму,
  # але ми змусимо його використовувати жорсткий URL.
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false # Тримаємо вимкненим, як планували

# ❗️ ОСЬ КЛЮЧОВЕ ВИПРАВЛЕННЯ СТРУКТУРИ
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      product-service:
        # Переконайся, що відступи правильні (2 пробіли)
        url: http://product-service.crafthub.internal:8082

application:
  sqs:
    orders-queue-url: https://sqs.eu-north-1.amazonaws.com/437387546814/orders_queue

aws:
  xray:
    enabled: true

management:
  tracing:
    enabled: false