# ======================================================
# === GENERAL SETTINGS ===
# ======================================================
server:
  port: 8083

spring:
  application:
    name: order-service
  profiles:
    active: local # Default profile

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_service_db}
    username: ${DB_USER:milhub}
    password: ${DB_PASS:password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    format_sql: true

management:
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10          # Keep track of last 10 requests
        minimumNumberOfCalls: 5        # Start analysis after the 5th request
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s    # "Quarantine" duration (blocking)
        failureRateThreshold: 50       # Failure threshold (50%)
        eventConsumerBufferSize: 10
        ignoreExceptions:              # Do not count these as service failures
          - com.milhub.order_service.exception.ResourceNotFoundException
          - com.milhub.order_service.exception.BusinessException
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest
---
# ======================================================
# === "local" PROFILE (Kafka + Zipkin + Eureka) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

  cloud:
    aws:
      sqs:
        enabled: false
      region:
        static: us-east-1
      credentials:
        access-key: dummy
        secret-key: dummy

  # Kafka settings (local only)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

feign:
  client:
    config:
      product-service:
        # For local development (direct access or via Gateway)
        url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

aws:
  xray:
    enabled: false


---
# ======================================================
# === "aws" PROFILE (SQS + X-Ray + Cloud Map) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # We enable LoadBalancer but not Discovery!
  # Feign requires some mechanism, but we force it to use a static URL.
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false # Тримаємо вимкненим, як планували

# KEY STRUCTURE FIX
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      product-service:
        # Ensure correct indentation (2 spaces)
        url: http://product-service.milhub.internal:8082

application:
  sqs:
    orders-queue-url: https://sqs.eu-north-1.amazonaws.com/437387546814/orders_queue

aws:
  xray:
    enabled: true

management:
  tracing:
    enabled: false