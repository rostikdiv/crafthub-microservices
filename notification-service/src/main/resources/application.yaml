# ======================================================
# === GENERAL CONFIGURATION ===
# ======================================================
server:
  port: 8084

spring:
  application:
    name: notification-service
  profiles:
    active: local # Default active profile

management:
  tracing:
    sampling:
      probability: 1.0

---
# ======================================================
# === PROFILE: "local" (Kafka + Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

  # Disable AWS autoconfiguration for local profile
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: "notification-group"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 54baf4bfea8233
    password: 70ea0c846bc5da
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

aws:
  xray:
    enabled: false

---
# ======================================================
# === PROFILE: "aws" (SQS + X-Ray) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  cloud:
    aws:
      autoconfigure:
        enabled: true
    discovery:
      enabled: false

  # Disable Eureka and Zipkin for AWS profile to prioritize AWS-native services
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

io:
  awspring:
    cloud:
      sqs:
        auto-create-queues: false # Disable automatic queue creation

application:
  sqs:
    # URL of target SQS queue
    orders-queue-url: https://sqs.eu-north-1.amazonaws.com/437387546814/orders_queue

aws:
  xray:
    enabled: true
  region:
    static: ${AWS_REGION:eu-north-1}

management:
  tracing:
    enabled: false