# ======================================================
# === ЗАГАЛЬНІ НАЛАШТУВАННЯ ===
# ======================================================
server:
  port: 8084

spring:
  application:
    name: notification-service
  profiles:
    active: local # ❗️ Профіль за замовчуванням

management:
  tracing:
    sampling:
      probability: 1.0

---
# ======================================================
# === ПРОФІЛЬ "local" (Kafka + Zipkin) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: local

    #  cloud:
    #    aws:
    #      autoconfigure:
    #        enabled: false

    # ❗️ ВИМКНУТИ AWS автоконфігурацію глобально
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
      - com.amazonaws.xray.spring.aop.XRayAutoConfiguration
      - io.awspring.cloud.autoconfigure.actuator.AwsActuatorAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

  # Налаштування Kafka (тільки для local)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: "notification-group"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

aws:
  xray:
    enabled: false

---
# ======================================================
# === ПРОФІЛЬ "aws" (SQS + X-Ray) ===
# ======================================================
spring:
  config:
    activate:
      on-profile: aws

  cloud:
    aws:
      autoconfigure:
        enabled: true
    discovery:
      enabled: false # ❗️ Вимикаємо

  # ❗️ УВІМКНУТИ AWS автоконфігурацію для AWS профілю

  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.DiscoveryClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

io:
  awspring:
    cloud:
      sqs:
        auto-create-queues: false # ЗАБОРОНИТИ СТВОРЮВАТИ ЧЕРГИ

application:
  sqs:
    # ❗️ Встав сюди СВІЙ URL з консолі SQS
    orders-queue-url: https://sqs.eu-north-1.amazonaws.com/437387546814/orders_queue

aws:
  xray:
    enabled: true
  region:
    static: ${AWS_REGION:eu-north-1}

management:
  tracing:
    enabled: false