server:
  port: 8080

spring:
  cloud:
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.0.0.3:9092}
    consumer:
      group-id: "notification-group"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:${MAILTRAP_USER:dummy}}
    password: ${SPRING_MAIL_PASSWORD:${MAILTRAP_PASS:dummy}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""
  endpoints:
    web:
      exposure:
        include: health, liveness, readiness, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

logging:
  structured:
    json:
      enabled: true
