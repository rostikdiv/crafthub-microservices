<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Верифікацію відхилено</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #ef4444; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .header h1 { color: #ef4444; margin: 0; font-size: 24px; }
        .content { padding: 20px 0; }
        .reason-box { background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 15px; margin: 15px 0; border-radius: 4px; color: #991b1b; }
        .footer { text-align: center; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Верифікацію відхилено ❌</h1>
        </div>
        <div class="content">
            <p>На жаль, ми не змогли підтвердити ваш акаунт під час перевірки документів.</p>
            
            <div class="reason-box">
                <strong>Причина:</strong> <span th:text="${reason}"></span>
            </div>
            
            <p>Будь ласка, виправте вказані недоліки та завантажте документи повторно в особистому кабінеті.</p>
            <p>Якщо у вас виникли питання, зверніться до нашої служби підтримки.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 CraftHub.</p>
        </div>
    </div>
</body>
</html>
