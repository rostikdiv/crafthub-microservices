<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delivery Status Update</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #3b82f6; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .header h1 { color: #3b82f6; margin: 0; font-size: 24px; }
        .content { padding: 20px 0; text-align: center; }
        .status-box { display: inline-block; padding: 10px 20px; background-color: #eff6ff; color: #1d4ed8; border-radius: 6px; font-weight: bold; font-size: 18px; margin: 15px 0; border: 1px solid #bfdbfe; }
        .footer { text-align: center; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Delivery Status Update 🚚</h1>
        </div>
        <div class="content">
            <p>The delivery status for your order #<span th:text="${orderId}"></span> has been updated.</p>
            <div class="status-box">
                <span th:text="${statusText}"></span>
            </div>
            <p>Thank you for using the MilHub platform!</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 MilHub.</p>
        </div>
    </div>
</body>
</html>
