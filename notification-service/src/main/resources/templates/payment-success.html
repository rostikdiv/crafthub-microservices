<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #10b981; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .header h1 { color: #10b981; margin: 0; font-size: 24px; }
        .content { padding: 20px 0; text-align: center; }
        .footer { text-align: center; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; }
        .highlight { font-weight: bold; color: #111827; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Payment Successful! ✅</h1>
        </div>
        <div class="content">
            <p>Your payment for order #<span th:text="${orderId}"></span> in the amount of <span class="highlight" th:text="${amount} + ' UAH'"></span> has been processed successfully.</p>
            <p>The vendor has been notified and is now preparing your shipment.</p>
            <p>You can track the order status directly in your dashboard.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 MilHub. Defense Logistics & Marketplace Platform.</p>
        </div>
    </div>
</body>
</html>
