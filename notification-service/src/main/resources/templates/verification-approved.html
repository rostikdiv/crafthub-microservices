<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Акаунт верифіковано</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #10b981; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .header h1 { color: #10b981; margin: 0; font-size: 24px; }
        .content { padding: 20px 0; text-align: center; }
        .footer { text-align: center; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #10b981; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Вітаємо! Ваш акаунт підтверджено ✅</h1>
        </div>
        <div class="content">
            <p>Ваші документи успішно пройшли перевірку.</p>
            <p>Тепер ви маєте повний доступ до функціоналу платформи.</p>
            <p>Бажаємо успішної роботи на платформі CraftHub!</p>
            <div style="text-align: center;">
                <a href="#" class="btn">Перейти до кабінету</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 CraftHub.</p>
        </div>
    </div>
</body>
</html>
